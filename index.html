<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with Noor</title>
<style>
  :root {
    --bg: #eef5f1;
    --panel: #ffffff;
    --ink: #1d2b2a;
    --muted: #5f7370;
    --line: #d5e3de;
    --accent: #0f766e;
    --accent-ink: #ffffff;
    --user-bg: #0f766e;
    --user-ink: #ffffff;
    --bot-bg: #fff4d6;
    --chip-bg: #e2f1ec;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1b1a;
      --panel: #172625;
      --ink: #e6f2ef;
      --muted: #9bb5b0;
      --line: #28403d;
      --accent: #4fd1c0;
      --accent-ink: #0f1b1a;
      --user-bg: #4fd1c0;
      --user-ink: #0f1b1a;
      --bot-bg: #2b2a1c;
      --chip-bg: #1f3532;
      --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    line-height: 1.55;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 12px;
  }

  header { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 48px; height: 48px; flex: none;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid; place-items: center;
    font-size: 1.4rem; font-weight: bold;
  }
  .who { flex: 1; min-width: 0; }
  .who h1 { margin: 0; font-size: 1.25rem; }
  .who p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .icon-btn {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    font: inherit;
    font-size: 0.9rem;
    cursor: pointer;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 86%;
    padding: 10px 14px;
    border-radius: 18px;
    overflow-wrap: anywhere;
  }
  .msg p { margin: 0 0 6px; }
  .msg p:last-child { margin-bottom: 0; }
  .msg.user { align-self: flex-end; background: var(--user-bg); color: var(--user-ink); border-bottom-right-radius: 5px; }
  .msg.bot { align-self: flex-start; background: var(--bot-bg); border-bottom-left-radius: 5px; }
  .msg.problem { align-self: flex-start; background: transparent; border: 1px solid var(--error); color: var(--error); }
  .msg small { display: block; margin-top: 6px; opacity: 0.8; font-size: 0.78rem; }
  .bullet { padding-left: 1.1em; text-indent: -1.1em; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; }
  .chip {
    background: var(--chip-bg);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    font: inherit;
    font-size: 0.92rem;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }

  .dots span {
    display: inline-block; width: 8px; height: 8px; margin-right: 4px;
    border-radius: 50%; background: var(--muted); opacity: 0.4;
  }
  @media (prefers-reduced-motion: no-preference) {
    .dots span { animation: bob 1.2s infinite; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bob { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
    #log { scroll-behavior: smooth; }
  }

  form.composer { display: flex; gap: 8px; align-items: flex-end; }
  textarea, input[type=password], input[type=text] {
    font: inherit;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 11px 14px;
    width: 100%;
  }
  form.composer textarea { resize: none; min-height: 48px; max-height: 140px; }
  .send {
    font: inherit; font-weight: bold;
    border: 0; border-radius: 14px;
    padding: 12px 20px;
    background: var(--accent); color: var(--accent-ink);
    cursor: pointer;
  }
  .send:disabled { opacity: 0.5; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  dialog {
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; width: min(92vw, 440px);
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  dialog h2 { margin: 0 0 6px; font-size: 1.15rem; }
  dialog p { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; }
  dialog label { display: block; font-size: 0.85rem; color: var(--muted); margin: 12px 0 4px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 0.9rem; color: var(--muted); }
  .check input { width: auto; }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="avatar" aria-hidden="true">N</div>
    <div class="who">
      <h1>Noor</h1>
      <p>Here to help, whenever you’re ready.</p>
    </div>
    <button class="icon-btn" id="newChat" type="button">New chat</button>
    <button class="icon-btn" id="openSettings" type="button" aria-label="Settings">Settings</button>
  </header>

  <section id="log" aria-live="polite"></section>

  <form class="composer" id="form">
    <textarea id="prompt" rows="1" placeholder="Say hi or ask me anything" aria-label="Your message"></textarea>
    <button class="send" type="submit" id="send">Send</button>
  </form>
</main>

<dialog id="settings">
  <h2>Quick setup</h2>
  <p>Noor needs your Gemini key to chat. It stays in your browser and is never saved in the website’s code.</p>
  <label for="apiKey">Gemini API key</label>
  <input id="apiKey" type="password" autocomplete="off" placeholder="Paste your key here">
  <label for="model">Model</label>
  <input id="model" type="text" value="gemini-flash-lite-latest">
  <label class="check"><input id="remember" type="checkbox"> Remember my key on this device</label>
  <div class="row">
    <button class="icon-btn" type="button" id="closeSettings">Done</button>
  </div>
</dialog>

<script>
  const $ = (id) => document.getElementById(id);
  const log = $("log"), form = $("form"), promptEl = $("prompt"), sendBtn = $("send");
  const keyEl = $("apiKey"), modelEl = $("model"), rememberEl = $("remember"), dialog = $("settings");

  const PERSONA = "You are Noor, a warm, friendly and encouraging assistant. " +
    "Use simple words and short paragraphs. Be kind and positive, and keep answers brief " +
    "unless the person asks for more detail. Ask a gentle follow-up question when it helps.";
  const GREETING = "Hi, I’m Noor! It’s lovely to meet you. Ask me anything, or pick one of these to start.";
  const SUGGESTIONS = [
    "What is cloud computing?",
    "Explain it like I’m 10",
    "Give me a study tip",
    "Tell me something fun"
  ];

  let history = [];

  // Restore saved settings
  try {
    const k = localStorage.getItem("noor_key");
    if (k) { keyEl.value = k; rememberEl.checked = true; }
    const m = localStorage.getItem("noor_model");
    if (m) modelEl.value = m;
  } catch (e) {}

  function saveSettings() {
    try {
      if (rememberEl.checked && keyEl.value.trim()) localStorage.setItem("noor_key", keyEl.value.trim());
      else localStorage.removeItem("noor_key");
      localStorage.setItem("noor_model", modelEl.value.trim());
    } catch (e) {}
  }

  $("openSettings").addEventListener("click", () => dialog.showModal());
  $("closeSettings").addEventListener("click", () => { saveSettings(); dialog.close(); promptEl.focus(); });
  dialog.addEventListener("close", saveSettings);

  // Show text with **bold** and bullet lines, built safely without innerHTML
  function renderText(container, text) {
    container.textContent = "";
    text.split(/\n+/).forEach((line) => {
      if (!line.trim()) return;
      const p = document.createElement("p");
      let body = line;
      const bullet = body.match(/^\s*[*-]\s+(.*)$/);
      if (bullet) { body = bullet[1]; p.className = "bullet"; p.appendChild(document.createTextNode("• ")); }
      body = body.replace(/^#+\s*/, "");
      body.split(/\*\*(.+?)\*\*/g).forEach((part, i) => {
        if (i % 2 === 1) { const s = document.createElement("strong"); s.textContent = part; p.appendChild(s); }
        else if (part) p.appendChild(document.createTextNode(part.replace(/\*/g, "")));
      });
      container.appendChild(p);
    });
  }

  function addMessage(text, kind) {
    const div = document.createElement("div");
    div.className = "msg " + kind;
    if (text) renderText(div, text);
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function showChips() {
    const wrap = document.createElement("div");
    wrap.className = "chips";
    wrap.id = "chips";
    SUGGESTIONS.forEach((s) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = s;
      b.addEventListener("click", () => sendMessage(s));
      wrap.appendChild(b);
    });
    log.appendChild(wrap);
  }

  function startChat() {
    history = [];
    log.textContent = "";
    addMessage(GREETING, "bot");
    showChips();
  }

  function friendlyError(status, message) {
    const m = (message || "").toLowerCase();
    if (m.includes("api key") || status === 401 || status === 403)
      return "That key doesn’t seem to work. Open Settings and check that it’s pasted correctly.";
    if (status === 404 || m.includes("not found") || m.includes("no longer available"))
      return "That model isn’t available. Open Settings and try a different model name.";
    if (status === 429 || status === 503 || m.includes("high demand") || m.includes("quota"))
      return "I’m getting a lot of questions right now. Please try again in a minute.";
    return "Sorry, I couldn’t answer that just now. Please try again.";
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function askGemini(apiKey, model) {
    const url = "https://generativelanguage.googleapis.com/v1beta/models/" +
      encodeURIComponent(model) + ":generateContent";
    const body = { contents: history, systemInstruction: { parts: [{ text: PERSONA }] } };
    let last = { status: 0, message: "" };

    for (let attempt = 0; attempt < 3; attempt++) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 45000);
      let res, data;
      try {
        res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
          body: JSON.stringify(body),
          signal: controller.signal
        });
        data = await res.json().catch(() => ({}));
      } catch (err) {
        clearTimeout(timer);
        last = { status: 0, message: err.name === "AbortError" ? "timeout" : "network" };
        if (attempt < 2) { await sleep(2000); continue; }
        break;
      }
      clearTimeout(timer);

      if (res.ok) {
        const cand = data.candidates && data.candidates[0];
        const parts = cand && cand.content && cand.content.parts;
        if (parts && parts.length) return parts.map((p) => p.text || "").join("");
        throw { status: 200, message: "empty answer", friendly: "I couldn’t come up with an answer for that. Could you ask it another way?" };
      }

      last = { status: res.status, message: (data.error && data.error.message) || ("status " + res.status) };
      const busy = [429, 500, 503].includes(res.status);
      if (busy && attempt < 2) { await sleep(2500 * (attempt + 1)); continue; }
      break;
    }
    if (last.message === "timeout")
      throw { status: 0, message: "timeout", friendly: "That’s taking longer than usual. Please try again in a moment." };
    if (last.message === "network")
      throw { status: 0, message: "network", friendly: "I can’t connect right now. Please check your internet and try again." };
    throw { status: last.status, message: last.message, friendly: friendlyError(last.status, last.message) };
  }

  async function sendMessage(text) {
    text = text.trim();
    if (!text || sendBtn.disabled) return;
    const apiKey = keyEl.value.trim();
    const model = modelEl.value.trim() || "gemini-flash-lite-latest";

    const chips = $("chips");
    if (chips) chips.remove();
    addMessage(text, "user");
    promptEl.value = "";

    if (!apiKey) {
      addMessage("I’d love to chat! I just need your key first. Tap Settings, paste it in, and say hi again.", "bot");
      dialog.showModal();
      return;
    }

    history.push({ role: "user", parts: [{ text }] });
    sendBtn.disabled = true;
    const pending = addMessage("", "bot");
    pending.innerHTML = '<span class="dots" aria-label="Noor is typing"><span></span><span></span><span></span></span>';

    try {
      const answer = await askGemini(apiKey, model);
      history.push({ role: "model", parts: [{ text: answer }] });
      renderText(pending, answer);
    } catch (err) {
      history.pop();
      pending.className = "msg problem";
      pending.textContent = (err && err.friendly) || "Sorry, something went wrong. Please try again.";
      if (err && err.message) {
        const detail = document.createElement("small");
        detail.textContent = "Details: " + err.message;
        pending.appendChild(detail);
      }
    } finally {
      sendBtn.disabled = false;
      promptEl.focus();
      log.scrollTop = log.scrollHeight;
    }
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); sendMessage(promptEl.value); });
  promptEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  $("newChat").addEventListener("click", startChat);

  startChat();
</script>
</body>
</html>
